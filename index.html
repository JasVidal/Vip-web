<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: brown;
            width: 200px;
            height: 200px;
        }

        .card-cta {
        position: relative;
        background-color: blue;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
        border-radius: 10px;
        }

        .card-title{
        height: 60px;
        padding: 10px 0;
        }
        .card-btn{
        position: absolute;
        top: 50px;
        border: none;
        padding: 4px 20px;
        border-radius: 10px;
        }
        
    </style>
</head>
<body>
    <div class="card">
       <div class="card-cta">
        <div class="card-title">Titulo</div>
            <button class="card-btn">Contactar</button>

       </div>
    </div>
</body>
</html>
