<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }

        .card {
        background-image: url('./img/concept-1868728_1280.jpg');
        background-size: cover;
        background-position: center;
        width: 300px;
        height: 400px;
        border-radius: 20px;
        padding: 20px;
        }

        .card-cta {
        position: relative;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
        border-radius: 20px;
        }

        .card-title{
        width: 400px;
        height: 100px;
        padding: 10px 80px;
        font-family: Josefin Sans, sans-serif;
        font-size: 20px;
        font-weight: 600;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #1A284E;
        }

        .card-btn{
        background-color: #FBBB1E;
        position: absolute;
        top: 90px;
        border: none;
        padding: 20px 40px;
        border-radius: 40px;
        font-family: Josefin Sans, sans-serif;
        font-size: 20px;
        font-weight: 600;
        }
        
    </style>
</head>
<body>
    <div class="card">
       <div class="card-cta">
        <div class="card-title">Levantamiento de Observaciones</div>
            <button class="card-btn">Contactar</button>

       </div>
    </div>
</body>
</html>
