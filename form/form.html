<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }

        .form{
        background-color: #ffffff;
        width: 500px;
        font-family: Poppins, sans-serif;
        }

        .form-cta{
        position: relative;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
        border-radius: 20px;
        }

        .form-title{
            width: 400px;
            height: 100px;
            display: flex;
            flex-direction: column;

        }

        h1{
            font-size: 30px;
            font-weight: 700;
            color: #000000;
            line-height: 2em;
        }

        input{
            width: 400px;
            height: 50px;
            margin: 10px 0;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            background-color: #F2F2F2;
            font-size: 14px;
            font-family: Poppins, sans-serif;
            
        }

        .form-btn{
            background-color: #FBBB1E;
            border: none;
            padding: 18px 180px;
            border-radius: 30px;
            font-family: Poppins, sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

    </style>
</head>
<body>
    <div class="form">
        <div class="form-cta">
            <div class="form-title">
                <h1>Agenda una asesoría</h1>
                <p>Completa el formulario de contacto para comunicarte con nosotros</p>
            </div>
            <div class="inputs-container">
                <form>
                    <input type="text" placeholder="Nombre" required>
                    <input type="email" placeholder="Email" required>
                    <input type="text" placeholder="Teléfono" required>
                    <input type="text" placeholder="Mensaje" required>
                    <button class="form-btn">ENVIAR</button>
                </form>
            </div>
    </div>
    
</body>
</html>
