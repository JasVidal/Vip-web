<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Poppins, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .counter {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background-color: #FBBB1E;
            border-radius: 20px;
        }
        .counter div {
            text-align: center;
            padding: 20px;
        }
        .counter i {
            font-size: 50px;
            color: #333;
        }
        .counter h1 {
            font-size: 2em;
            margin: 10px 0;
            color: #1E284F;
        }
        .counter h3 {
            font-size: 1em;
            font-weight: 500;
            color: #1E284F;
        }
    </style>

</head>
<body>
    <div class="counter">
        <div class="counter-clientes">
            <i class="fa-solid fa-user"></i>
            <h1>+120</h1>
            <h3>Clientes</h3>
        </div>
        <div class="counter-proyectos">
            <i class="fa-solid fa-briefcase"></i>
            <h1>100%</h1>
            <h3>Proyectos Completados</h3>
        </div>
        <div class="counter-experiencia">
            <i class="fa-solid fa-handshake"></i>
            <h1>+10</h1>
            <h3>Años de Experiencia</h3>
        </div>
        <div class="counter-recomendaciones">
            <i class="fa-solid fa-trophy"></i>
            <h1>100%</h1>
            <h3>Recomendado</h3>
        </div>
    </div>
</body>
</html>
